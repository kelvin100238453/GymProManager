<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPro Manager</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: white;
        }
        p {
            color: #9ca3af;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .credentials {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        .credentials h3 {
            color: #60a5fa;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .credentials p {
            color: #d1d5db;
            font-size: 0.8rem;
            margin: 2px 0;
        }
        .btn {
            width: 100%;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 8px 0;
        }
        .btn-primary {
            background: #4f46e5;
            color: white;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-secondary {
            background: #374151;
            color: white;
        }
        .btn-secondary:hover {
            background: #4b5563;
        }
        .form-group {
            margin: 15px 0;
        }
        label {
            display: block;
            color: #a78bfa;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        .error {
            color: #ef4444;
            font-size: 0.9rem;
            margin: 10px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="container">
            <div class="logo">💪</div>
            <h1>GymPro Manager</h1>
            <p>Tu asistente de gimnasio personal</p>
            
            <!-- Login inicial -->
            <div id="login-form">
                <div class="credentials">
                    <h3>Credenciales Demo:</h3>
                    <p>Email: 8092073906k@gmail.com</p>
                    <p>Contraseña: 123</p>
                </div>
                
                <button class="btn btn-primary" onclick="showLogin()">
                    Soy Entrenador
                </button>
                <button class="btn btn-secondary" onclick="showLogin()">
                    Soy Cliente
                </button>
            </div>

            <!-- Formulario de login -->
            <div id="trainer-login" class="hidden">
                <h2 style="margin-bottom: 20px; color: white;">Acceso Entrenador</h2>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                
                <div id="login-error" class="error hidden"></div>
                
                <button class="btn btn-primary" onclick="login()">
                    Entrar
                </button>
                
                <button class="btn btn-secondary" onclick="goBack()">
                    ← Volver
                </button>
            </div>

            <!-- Dashboard -->
            <div id="dashboard" class="hidden">
                <h2>¡Bienvenido!</h2>
                <p>Has iniciado sesión correctamente</p>
                
                <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px; padding: 20px; margin: 20px 0;">
                    <h3 style="color: #34d399; margin-bottom: 10px;">🎉 Aplicación Funcionando</h3>
                    <p style="color: #d1d5db;">La aplicación está cargando correctamente y el login es funcional.</p>
                </div>
                
                <button class="btn btn-secondary" onclick="logout()">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </div>

    <script type="text/babel">
        // Versión simplificada que garantiza la renderización
        console.log('🚀 GymPro Manager cargando...');
        
        // Función para mostrar formulario de login
        function showLogin() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('trainer-login').classList.remove('hidden');
            console.log('📝 Formulario de login mostrado');
        }
        
        // Función para volver al inicio
        function goBack() {
            document.getElementById('trainer-login').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('login-error').classList.add('hidden');
        }
        
        // Función de login
        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            console.log('🔐 Intentando login...', { email });
            
            // Validar credenciales
            if (email === '8092073906k@gmail.com' && password === '123') {
                console.log('✅ Login exitoso');
                
                // Mostrar dashboard
                document.getElementById('trainer-login').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                // Guardar en localStorage
                localStorage.setItem('currentUser', JSON.stringify({
                    email: email,
                    role: 'entrenador',
                    name: 'Entrenador Usuario'
                }));
                
            } else {
                console.log('❌ Login fallido');
                errorDiv.textContent = 'Email o contraseña incorrectos';
                errorDiv.classList.remove('hidden');
            }
        }
        
        // Función de logout
        function logout() {
            localStorage.removeItem('currentUser');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('login-form').classList.remove('hidden');
            console.log('👋 Sesión cerrada');
        }
        
        // Verificar si ya hay sesión activa
        window.addEventListener('load', function() {
            console.log('📱 Verificando sesión activa...');
            
            const user = localStorage.getItem('currentUser');
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    console.log('👤 Usuario encontrado:', userData);
                    document.getElementById('login-form').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                } catch (e) {
                    console.warn('⚠️ Error al leer sesión:', e);
                    localStorage.removeItem('currentUser');
                }
            }
            
            console.log('✨ GymPro Manager listo para usar');
        });
        
        // Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('🔧 ServiceWorker registrado:', registration.scope);
                    })
                    .catch(err => {
                        console.log('❌ Error de ServiceWorker:', err);
                    });
            });
        }
    </script>
</body>
</html>
