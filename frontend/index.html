                                        {measurementKeys.map(mk => (
                                            <td key={mk.key} className="px-4 py-2 text-right">
                                                <ChangeIndicator
                                                    currentValue={m[mk.key]}
                                                    previousValue={previousMeasurement?.[mk.key]}
                                                />
                                            </td>
                                        ))}
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        };
        
        const ClientProgressModal = ({ isOpen, onClose, client }) => {
            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`Progreso de ${client.name}`} className="max-w-4xl">
                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                        <div className="lg:col-span-3 bg-gray-800/50 rounded-lg p-4">
                            <h3 className="text-xl font-bold mb-4">Historial de Mediciones</h3>
                            <MeasurementHistoryTable measurements={client.measurements || []} />
                        </div>
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-gray-800/50 rounded-lg p-4">
                                <h3 className="text-xl font-bold mb-4">Simulación Corporal</h3>
                                <BodyHologram measurements={client.measurements || []} />
                            </div>
                        </div>
                    </div>
                </Modal>
            );
        };

        const ClientDetailView = ({ client, onBack, onUpdateClient, onDeleteClient, allExercises }) => {
            const [activeTab, setActiveTab] = useState('progress');
            const [isEditModalOpen, setEditModalOpen] = useState(false);
            const [isAddExModalOpen, setAddExModalOpen] = useState(false);
            const [isEditExModalOpen, setEditExModalOpen] = useState(false);
            const [editingEx, setEditingEx] = useState(null);
            const [addingToDay, setAddingToDay] = useState(null);
            const [selectedWeekIndex, setSelectedWeekIndex] = useState(0);
            const [newMeasurement, setNewMeasurement] = useState({ weight: '', waist: '', chest: '', hips: '', bicepsR: '', bicepsL: '', thighsR: '', thighsL: '', calvesR: '', calvesL: '' });

            const handleMeasurementChange = (e) => {
                setNewMeasurement({ ...newMeasurement, [e.target.name]: e.target.value });
            };

            const handleRoutineChange = (newRoutine) => { onUpdateClient({ ...client, customRoutine: newRoutine }); };
            
            const handleAddWeek = () => {
                const newWeek = DAYS_OF_WEEK.reduce((acc, day) => ({ ...acc, [day]: { title: 'Día de Descanso', exercises: [] } }), {});
                handleRoutineChange([...(client.customRoutine || []), newWeek]);
                setSelectedWeekIndex((client.customRoutine || []).length);
            };

            const handleUpdateDayTitle = (weekIndex, day, title) => {
                const newRoutine = JSON.parse(JSON.stringify(client.customRoutine));
                newRoutine[weekIndex][day].title = title;
                handleRoutineChange(newRoutine);
            };
            
            const handleAddExercises = (exercisesToAdd) => {
                if (!addingToDay) return;
                const { weekIndex, day } = addingToDay;
                const newCustomExercises = exercisesToAdd.map(ex => ({
                    instanceId: `ex-inst-${Date.now()}-${Math.random()}`,
                    exerciseId: ex.id,
                    name: ex.name,
                    description: ex.description,
                    sets: ex.sets,
                    reps: ex.reps,
                    time: ex.time,
                    rest: ex.rest,
                }));

                const newRoutine = JSON.parse(JSON.stringify(client.customRoutine));
                newRoutine[weekIndex][day].exercises.push(...newCustomExercises);
                handleRoutineChange(newRoutine);
                setAddExModalOpen(false);
            };
            
            const handleSaveCustomExercise = (updatedEx) => {
                if(!editingEx) return;
                const { weekIndex, day, instanceId } = editingEx;
                const newRoutine = JSON.parse(JSON.stringify(client.customRoutine));
                const exIndex = newRoutine[weekIndex][day].exercises.findIndex(e => e.instanceId === instanceId);
                if(exIndex > -1) newRoutine[weekIndex][day].exercises[exIndex] = { ...newRoutine[weekIndex][day].exercises[exIndex], ...updatedEx };
                handleRoutineChange(newRoutine);
                setEditExModalOpen(false);
            };
            
            const handleDeleteExercise = (weekIndex, day, instanceId) => {
                const newRoutine = JSON.parse(JSON.stringify(client.customRoutine));
                newRoutine[weekIndex][day].exercises = newRoutine[weekIndex][day].exercises.filter(e => e.instanceId !== instanceId);
                handleRoutineChange(newRoutine);
            };

            const handleAddMeasurement = (e) => {
                e.preventDefault();
                const measurement = { 
                    id: `m-${client.id}-${Date.now()}`,
                    date: new Date().toISOString().split('T')[0],
                    weight: parseFloat(newMeasurement.weight),
                    waist: parseFloat(newMeasurement.waist),
                    chest: parseFloat(newMeasurement.chest),
                    hips: parseFloat(newMeasurement.hips),
                    bicepsR: parseFloat(newMeasurement.bicepsR),
                    bicepsL: parseFloat(newMeasurement.bicepsL),
                    thighsR: parseFloat(newMeasurement.thighsR),
                    thighsL: parseFloat(newMeasurement.thighsL),
                    calvesR: parseFloat(newMeasurement.calvesR),
                    calvesL: parseFloat(newMeasurement.calvesL),
                };
                onUpdateClient({ ...client, measurements: [...(client.measurements || []), measurement] });
                setNewMeasurement({ weight: '', waist: '', chest: '', hips: '', bicepsR: '', bicepsL: '', thighsR: '', thighsL: '', calvesR: '', calvesL: '' });
            };
            
            const handleSaveClientInfo = (updatedData) => {
                onUpdateClient({...client, ...updatedData});
                setEditModalOpen(false);
            };

            const routine = client.customRoutine || [];
            const currentWeekRoutine = routine[selectedWeekIndex] || {};

            return (<div className="min-h-screen bg-gray-900 text-gray-100 p-3 sm:p-4"><div className="max-w-7xl mx-auto"><button onClick={onBack} className="flex items-center gap-2 text-indigo-400 hover:text-indigo-300 mb-4 font-semibold touch-manipulation"><ArrowLeftIcon className="w-5 h-5" /> Volver a Clientes</button><div className="bg-gray-800/50 rounded-lg p-4 sm:p-6 mb-4"><div className="flex flex-col sm:flex-row justify-between items-start gap-3"><h2 className="text-2xl sm:text-3xl font-bold text-white">{client.name}</h2><div className="flex gap-2"><button onClick={() => setEditModalOpen(true)} className="p-2 text-gray-400 hover:text-white touch-manipulation"><EditIcon className="w-5 h-5"/></button><button onClick={() => onDeleteClient(client.id)} className="p-2 text-gray-400 hover:text-red-500 touch-manipulation"><TrashIcon className="w-5 h-5"/></button></div></div><p className="text-sm sm:text-base text-gray-400">Nivel: {client.level} | Objetivos: {client.goals}</p></div><div className="flex space-x-1 bg-gray-800 rounded-lg p-1 mb-4 overflow-x-auto"><button onClick={() => setActiveTab('progress')} className={`flex-1 min-w-[120px] flex justify-center items-center gap-2 p-2 rounded-md transition text-sm sm:text-base ${activeTab === 'progress' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-700'}`}><ChartBarIcon className="w-4 h-4 sm:w-5 sm:h-5"/> Progreso</button><button onClick={() => setActiveTab('calendar')} className={`flex-1 min-w-[120px] flex justify-center items-center gap-2 p-2 rounded-md transition text-sm sm:text-base ${activeTab === 'calendar' ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-700'}`}><CalendarIcon className="w-4 h-4 sm:w-5 sm:h-5"/> Calendario</button></div>
            
            {activeTab === 'progress' && (
                <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                    <div className="lg:col-span-3 bg-gray-800/50 rounded-lg p-4">
                        <h3 className="text-xl font-bold mb-4">Historial de Mediciones</h3>
                        <MeasurementHistoryTable measurements={client.measurements || []} />
                    </div>
                    <div className="lg:col-span-2 space-y-6">
                        <div className="bg-gray-800/50 rounded-lg p-4">
                            <h3 className="text-xl font-bold mb-4">Simulación Corporal</h3>
                            <BodyHologram measurements={client.measurements || []} />
                        </div>
                        <div className="bg-gray-800/50 rounded-lg p-4">
                             <form onSubmit={handleAddMeasurement}>
                                <h3 className="text-xl font-bold mb-2">Añadir Medición</h3>
                                <div className="grid grid-cols-2 gap-x-4">
                                    <FormInput label="Peso (lb)" name="weight" type="number" step="0.1" value={newMeasurement.weight} onChange={handleMeasurementChange} />
                                    <FormInput label="Cintura (cm)" name="waist" type="number" step="0.1" value={newMeasurement.waist} onChange={handleMeasurementChange} />
                                    <FormInput label="Pecho (cm)" name="chest" type="number" step="0.1" value={newMeasurement.chest} onChange={handleMeasurementChange} />
                                    <FormInput label="Caderas (cm)" name="hips" type="number" step="0.1" value={newMeasurement.hips} onChange={handleMeasurementChange} />
                                    <FormInput label="Bíceps D (cm)" name="bicepsR" type="number" step="0.1" value={newMeasurement.bicepsR} onChange={handleMeasurementChange} />
                                    <FormInput label="Bíceps I (cm)" name="bicepsL" type="number" step="0.1" value={newMeasurement.bicepsL} onChange={handleMeasurementChange} />
                                    <FormInput label="Muslo D (cm)" name="thighsR" type="number" step="0.1" value={newMeasurement.thighsR} onChange={handleMeasurementChange} />
                                    <FormInput label="Muslo I (cm)" name="thighsL" type="number" step="0.1" value={newMeasurement.thighsL} onChange={handleMeasurementChange} />
                                    <FormInput label="Gemelo D (cm)" name="calvesR" type="number" step="0.1" value={newMeasurement.calvesR} onChange={handleMeasurementChange} />
                                    <FormInput label="Gemelo I (cm)" name="calvesL" type="number" step="0.1" value={newMeasurement.calvesL} onChange={handleMeasurementChange} />
                                </div>
                                <button type="submit" className="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg">Guardar Medición</button>
                            </form>
                        </div>
                    </div>
                </div>
            )}

            {activeTab === 'calendar' && (
                <div>
                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 sm:gap-4 mb-4">
                        <div className="flex space-x-1 bg-gray-800 rounded-lg p-1 overflow-x-auto">
                            {routine.map((_, index) => (
                                <button key={index} onClick={() => setSelectedWeekIndex(index)} className={`px-3 sm:px-4 py-2 rounded-md font-semibold whitespace-nowrap text-sm sm:text-base ${selectedWeekIndex === index ? 'bg-indigo-600 text-white' : 'text-gray-300 hover:bg-gray-700'}`}>
                                    Semana {index + 1}
                                </button>
                            ))}
                        </div>
                        <button onClick={handleAddWeek} className="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-lg whitespace-nowrap text-sm sm:text-base">
                            <PlusIcon className="w-5 h-5"/>
                            <span className="hidden sm:inline">Añadir Semana</span>
                            <span className="sm:hidden">Nueva</span>
                        </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-4">
                        {DAYS_OF_WEEK.map(day => (
                            <div key={day} className="bg-gray-800/50 rounded-lg p-3 sm:p-4 space-y-3">
                                <input 
                                    type="text" 
                                    value={currentWeekRoutine[day]?.title || ''} 
                                    onChange={(e) => handleUpdateDayTitle(selectedWeekIndex, day, e.target.value)}
                                    placeholder="Título del día" 
                                    className="w-full bg-gray-900 text-white text-base sm:text-lg font-bold p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                />
                                <div className="space-y-2 min-h-[80px] sm:min-h-[100px]">
                                    {(currentWeekRoutine[day]?.exercises || []).map(ex => (
                                        <div key={ex.instanceId} className="bg-black/40 p-2 rounded-md flex justify-between items-center gap-2">
                                            <div className="flex-1 min-w-0">
                                                <p className="font-semibold text-xs sm:text-sm truncate">{ex.name}</p>
                                                <p className="text-xs text-gray-400 font-medium">{ex.sets}×{ex.reps || `${ex.time}s`}, {ex.rest}s</p>
                                            </div>
                                            <div className="flex gap-1 flex-shrink-0">
                                                <button onClick={() => { setEditingEx({ ...ex, weekIndex: selectedWeekIndex, day }); setEditExModalOpen(true); }} className="p-1.5 text-gray-400 hover:text-white touch-manipulation">
                                                    <EditIcon className="w-4 h-4"/>
                                                </button>
                                                <button onClick={() => handleDeleteExercise(selectedWeekIndex, day, ex.instanceId)} className="p-1.5 text-gray-400 hover:text-red-500 touch-manipulation">
                                                    <TrashIcon className="w-4 h-4"/>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => { setAddingToDay({ weekIndex: selectedWeekIndex, day }); setAddExModalOpen(true); }} className="w-full flex items-center justify-center gap-2 bg-indigo-600/50 hover:bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2.5 sm:py-2 px-3 rounded-lg text-sm sm:text-base touch-manipulation transition-colors">
                                    <PlusIcon className="w-5 h-5"/>
                                    <span>Añadir Ejercicio</span>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            <ClientFormModal isOpen={isEditModalOpen} onClose={() => setEditModalOpen(false)} client={client} onSave={handleSaveClientInfo} />
            <AddExerciseToRoutineModal isOpen={isAddExModalOpen} onClose={() => setAddExModalOpen(false)} allExercises={allExercises} onAdd={handleAddExercises} />
            <EditCustomExerciseModal isOpen={isEditExModalOpen} onClose={() => setEditExModalOpen(false)} customExercise={editingEx} onSave={handleSaveCustomExercise} />
            </div></div>);
        };
        
        const AddExerciseToRoutineModal = ({isOpen, onClose, allExercises, onAdd}) => {
            const [selectedIds, setSelectedIds] = useState(new Set());
            const [searchTerm, setSearchTerm] = useState('');
            const handleToggle = (id) => { const newSet = new Set(selectedIds); if(newSet.has(id))newSet.delete(id); else newSet.add(id); setSelectedIds(newSet); }
            const handleSubmit = () => { const selected = allExercises.filter(ex => selectedIds.has(ex.id)); onAdd(selected); onClose(); setSelectedIds(new Set()); setSearchTerm(''); };
            
            const filteredExercises = useMemo(() => {
                return allExercises.filter(ex => ex.name.toLowerCase().includes(searchTerm.toLowerCase()));
            }, [allExercises, searchTerm]);

            const groupedExercises = useMemo(() => {
                return filteredExercises.reduce((acc, ex) => {
                    const category = ex.category || 'Sin Categoría';
                    if (!acc[category]) acc[category] = [];
                    acc[category].push(ex);
                    return acc;
                }, {});
            }, [filteredExercises]);

            const categories = Object.keys(groupedExercises).sort();

            return <Modal isOpen={isOpen} onClose={onClose} title="Añadir Ejercicios a la Rutina" className="max-w-4xl">
                <input 
                    type="text"
                    placeholder="Buscar ejercicio..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-gray-700 text-white rounded-lg py-2.5 sm:py-2 px-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-base"
                />
                <div className="max-h-[50vh] sm:max-h-[60vh] overflow-y-auto space-y-3">
                    {categories.map(category => (
                        <details key={category} className="bg-gray-800/50 rounded-lg">
                            <summary className="text-base sm:text-lg font-bold text-white p-3 cursor-pointer flex justify-between items-center hover:bg-gray-700/50 rounded-lg touch-manipulation">
                                <span className="pr-2">
                                    {category} <span className="text-xs sm:text-sm font-normal text-gray-400">({groupedExercises[category].length} ejercicios, {groupedExercises[category].filter(ex => selectedIds.has(ex.id)).length} seleccionados)</span>
                                </span>
                                <span className="transform transition-transform duration-200 flex-shrink-0">▼</span>
                            </summary>
                            <div className="p-3 border-t border-indigo-800/50 grid grid-cols-1 sm:grid-cols-2 gap-2">
                                {groupedExercises[category].map(ex => (
                                    <div key={ex.id} onClick={() => handleToggle(ex.id)} className={`p-3 rounded-lg cursor-pointer transition-colors touch-manipulation ${selectedIds.has(ex.id) ? 'bg-indigo-600 text-white' : 'bg-gray-700 hover:bg-gray-600'}`}>
                                        <h4 className="font-bold text-sm sm:text-base">{ex.name}</h4>
                                        <p className="text-xs text-gray-300 truncate">{(ex.tags || []).join(', ')}</p>
                                    </div>
                                ))}
                            </div>
                        </details>
                    ))}
                </div>
                <div className="mt-4 pt-4 border-t border-gray-700 flex flex-col sm:flex-row justify-between items-center gap-3">
                    <span className="text-gray-300 font-semibold text-sm sm:text-base">{selectedIds.size} ejercicio(s) seleccionado(s)</span>
                    <button onClick={handleSubmit} className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 sm:py-2 px-6 rounded-lg touch-manipulation transition-colors">
                        Añadir Seleccionados
                    </button>
                </div>
            </Modal>
        }
        
        const EditCustomExerciseModal = ({isOpen, onClose, customExercise, onSave}) => {
            const [formData, setFormData] = useState(null);
            useEffect(() => { setFormData(customExercise ? { ...customExercise } : null); }, [customExercise, isOpen]);
            if(!formData) return null;
            const handleChange = (e) => { setFormData({ ...formData, [e.target.name]: e.target.type === 'number' ? (e.target.value === '' ? '' : parseFloat(e.target.value) || 0) : e.target.value }); };
            const handleSubmit = (e) => { e.preventDefault(); onSave(formData); };
            return (<Modal isOpen={isOpen} onClose={onClose} title={`Editar: ${formData.name}`}><form onSubmit={handleSubmit}><div className="grid grid-cols-2 gap-4"><FormInput label="Series" name="sets" type="number" value={formData.sets || ''} onChange={handleChange} /><FormInput label="Reps" name="reps" type="number" value={formData.reps || ''} onChange={handleChange} /><FormInput label="Tiempo (seg)" name="time" type="number" step="0.1" value={formData.time || ''} onChange={handleChange} /><FormInput label="Descanso (seg)" name="rest" type="number" step="0.1" value={formData.rest || ''} onChange={handleChange} required /></div><FormTextarea label="Descripción Personalizada" name="description" value={formData.description} onChange={handleChange} /><button type="submit" className="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg">Guardar Cambios</button></form></Modal>);
        }
        
        const WorkoutHistoryModal = ({ isOpen, onClose, logs }) => {
            return (<Modal isOpen={isOpen} onClose={onClose} title="Historial de Actividad"><div className="max-h-[60vh] overflow-y-auto"><table className="w-full text-sm text-left table-auto"><thead className="text-xs text-indigo-300 uppercase bg-gray-700/50"><tr><th className="px-4 py-2">Fecha</th><th className="px-4 py-2 text-right">Tiempo de Entrenamiento</th></tr></thead><tbody>{[...logs].reverse().map(log => (<tr key={log.date} className="border-b border-gray-700"><td className="px-4 py-2">{new Date(log.date).toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</td><td className="px-4 py-2 text-right font-semibold">{log.duration} minutos</td></tr>))}</tbody></table>{logs.length === 0 && <p className="text-center text-gray-400 p-4">Aún no has registrado ningún entrenamiento.</p>}</div></Modal>)
        }

        // --- COMPONENTE PRINCIPAL DE LA APP ---
        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [viewingClient, setViewingClient] = useState(null);
            const [allExercises, setAllExercises] = useState([]);
            const [notifications, setNotifications] = useState([]);
            const [authReady, setAuthReady] = useState(false);

            useEffect(() => {
                try {
                    const storedUser = localStorage.getItem('currentUser');
                    const token = authProvider.getAccessToken();
                    if (storedUser && token) {
                        setCurrentUser(JSON.parse(storedUser));
                    }
                } catch (e) {
                    console.error("Failed to parse user from localStorage", e);
                    authProvider.clearTokens();
                }
                setAuthReady(true);
            }, []);

            useEffect(() => {
                if (currentUser) {
                    api.getExercises().then(setAllExercises).catch(console.error);
                    if (currentUser.role === Role.Trainer) {
                        api.getNotifications().then(setNotifications).catch(console.error);
                    }
                }
            }, [currentUser]);

            useEffect(() => {
                if (!currentUser) return;
                const unsubscribe = api.subscribe(() => {
                    console.log('API change detected, refreshing data...');
                    api.getExercises().then(setAllExercises).catch(console.error);
                    if (currentUser.role === Role.Trainer) {
                        api.getNotifications().then(setNotifications).catch(console.error);
                    }
                });
                return unsubscribe;
            }, [currentUser]);

            const handleLogin = (data) => {
                const { user, accessToken, refreshToken, token } = data;
                localStorage.setItem('currentUser', JSON.stringify(user));
                if (user.role === Role.Client) {
                    authProvider.setTokens(accessToken, refreshToken);
                } else {
                    authProvider.setTokens(token); // Trainer uses a single token
                }
                setCurrentUser(user);
            };
            
            const handleLogout = () => { 
                authProvider.logout();
            };
            
            const handleUpdateClient = (updatedClient) => {
                api.updateClient(updatedClient).then(newClientData => {
                    if (currentUser && currentUser.id === newClientData.id) {
                        localStorage.setItem('currentUser', JSON.stringify(newClientData));
                        setCurrentUser(newClientData);
                    }
                    if (viewingClient && viewingClient.id === newClientData.id) {
                        setViewingClient(newClientData);
                    }
                });
            };
            
            const handleDeleteClient = (clientId) => {
                if(window.confirm("¿Estás seguro de que quieres eliminar a este cliente? Esta acción es irreversible.")){
                    api.deleteClient(clientId).then(() => {
                        setViewingClient(null);
                    });
                }
            };

            if (!authReady) {
                return <div className="min-h-screen bg-gray-900 flex justify-center items-center"><LoadingSpinner /></div>;
            }

            if (!currentUser) {
                return <AuthFlow onLogin={handleLogin} />;
            }

            if (currentUser.role === Role.Trainer) {
                if (viewingClient) {
                    return <ClientDetailView 
                                client={viewingClient} 
                                onBack={() => setViewingClient(null)} 
                                onUpdateClient={handleUpdateClient} 
                                onDeleteClient={handleDeleteClient} 
                                allExercises={allExercises} 
                            />;
                }
                return <TrainerDashboard 
                            user={currentUser} 
                            onLogout={handleLogout} 
                            onViewClient={setViewingClient}
                            allExercises={allExercises}
                            notifications={notifications}
                        />;
            }

            if (currentUser.role === Role.Client) {
                return <ClientDashboard 
                            user={currentUser} 
                            allExercises={allExercises} 
                            onLogout={handleLogout} 
                            onNotify={api.addNotification} 
                            onLogWorkout={api.logWorkout}
                        />;
            }

            return <AuthFlow onLogin={handleLogin} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
</body>
</html>
